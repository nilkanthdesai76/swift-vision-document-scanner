<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%" style="background:#0a0c10; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10" />
      <stop offset="100%" stop-color="#12161f" />
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2333" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="purpleCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a1b3d" />
      <stop offset="100%" stop-color="#170f26" />
    </linearGradient>
    <linearGradient id="greenCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#132e27" />
      <stop offset="100%" stop-color="#0b1a16" />
    </linearGradient>
    <linearGradient id="orangeCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#332211" />
      <stop offset="100%" stop-color="#1f140a" />
    </linearGradient>
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="620" fill="url(#bgGrad)" />

  <!-- Header -->
  <text x="50" y="55" font-size="24" font-weight="700" fill="#f8fafc" letter-spacing="-0.5">swift-vision-document-scanner</text>
  <text x="50" y="80" font-size="13" font-weight="400" fill="#94a3b8">On-Device Edge Detection, Perspective Warp Correction, Document Enhancement &amp; PDF Export</text>

  <!-- Flow Arrows (Connecting Pipes) -->
  <path d="M 230 220 L 290 220" stroke="#334155" stroke-width="2" stroke-dasharray="4,4" fill="none" />
  <polygon points="290,216 298,220 290,224" fill="#38bdf8" />

  <path d="M 500 220 L 560 220" stroke="#334155" stroke-width="2" stroke-dasharray="4,4" fill="none" />
  <polygon points="560,216 568,220 560,224" fill="#818cf8" />

  <path d="M 770 220 L 830 220" stroke="#334155" stroke-width="2" stroke-dasharray="4,4" fill="none" />
  <polygon points="830,216 838,220 830,224" fill="#34d399" />

  <!-- Card 1: Input & Frame Capture -->
  <g filter="url(#shadow)">
    <rect x="50" y="120" width="180" height="200" rx="12" fill="url(#blueCard)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5" />
    <circle cx="80" cy="150" r="14" fill="#38bdf8" fill-opacity="0.15" />
    <text x="80" y="155" font-size="13" font-weight="600" fill="#38bdf8" text-anchor="middle">1</text>
    <text x="105" y="155" font-size="15" font-weight="600" fill="#f8fafc">Input Feed</text>

    <text x="70" y="195" font-size="12" fill="#cbd5e1">• AVFoundation Stream</text>
    <text x="70" y="220" font-size="12" fill="#cbd5e1">• CVPixelBuffer / CMSample</text>
    <text x="70" y="245" font-size="12" fill="#cbd5e1">• CGImage / UIImage</text>
    <text x="70" y="270" font-size="12" fill="#cbd5e1">• PhotosPicker Import</text>
    <text x="70" y="295" font-size="11" fill="#64748b">Zero memory copy</text>
  </g>

  <!-- Card 2: Vision Edge Detection -->
  <g filter="url(#shadow)">
    <rect x="300" y="120" width="200" height="200" rx="12" fill="url(#purpleCard)" stroke="#a855f7" stroke-opacity="0.3" stroke-width="1.5" />
    <circle cx="330" cy="150" r="14" fill="#a855f7" fill-opacity="0.15" />
    <text x="330" y="155" font-size="13" font-weight="600" fill="#c084fc" text-anchor="middle">2</text>
    <text x="355" y="155" font-size="15" font-weight="600" fill="#f8fafc">Vision Detector</text>

    <text x="320" y="195" font-size="12" fill="#cbd5e1">• VNDetectRectangles</text>
    <text x="320" y="220" font-size="12" fill="#cbd5e1">• Quadrilateral Analysis</text>
    <text x="320" y="245" font-size="12" fill="#cbd5e1">• Convexity Verification</text>
    <text x="320" y="270" font-size="12" fill="#cbd5e1">• Corner Reordering</text>
    <text x="320" y="295" font-size="11" fill="#a855f7">Fallback Inset Preset</text>
  </g>

  <!-- Card 3: Perspective Rectification & Filter -->
  <g filter="url(#shadow)">
    <rect x="570" y="120" width="200" height="200" rx="12" fill="url(#greenCard)" stroke="#34d399" stroke-opacity="0.3" stroke-width="1.5" />
    <circle cx="600" cy="150" r="14" fill="#34d399" fill-opacity="0.15" />
    <text x="600" y="155" font-size="13" font-weight="600" fill="#34d399" text-anchor="middle">3</text>
    <text x="625" y="155" font-size="15" font-weight="600" fill="#f8fafc">Processor &amp; Filter</text>

    <text x="590" y="195" font-size="12" fill="#cbd5e1">• CIPerspectiveCorrection</text>
    <text x="590" y="220" font-size="12" fill="#cbd5e1">• Dimension Estimation</text>
    <text x="590" y="245" font-size="12" fill="#cbd5e1">• Enhanced Color</text>
    <text x="590" y="270" font-size="12" fill="#cbd5e1">• Grayscale Clean</text>
    <text x="590" y="295" font-size="11" fill="#34d399">Adaptive High-Contrast B&amp;W</text>
  </g>

  <!-- Card 4: Multi-Page PDF Exporter -->
  <g filter="url(#shadow)">
    <rect x="840" y="120" width="130" height="200" rx="12" fill="url(#orangeCard)" stroke="#fb923c" stroke-opacity="0.3" stroke-width="1.5" />
    <circle cx="865" cy="150" r="14" fill="#fb923c" fill-opacity="0.15" />
    <text x="865" y="155" font-size="13" font-weight="600" fill="#fb923c" text-anchor="middle">4</text>
    <text x="890" y="155" font-size="15" font-weight="600" fill="#f8fafc">PDFKit</text>

    <text x="855" y="195" font-size="12" fill="#cbd5e1">• Multi-Page</text>
    <text x="855" y="220" font-size="12" fill="#cbd5e1">• A4 / Letter</text>
    <text x="855" y="245" font-size="12" fill="#cbd5e1">• Exact Match</text>
    <text x="855" y="270" font-size="12" fill="#cbd5e1">• PDFMetadata</text>
    <text x="855" y="295" font-size="11" fill="#fb923c">Atomic Export</text>
  </g>

  <!-- Bottom Architecture Matrix -->
  <rect x="50" y="350" width="920" height="230" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />

  <text x="75" y="385" font-size="14" font-weight="600" fill="#94a3b8" letter-spacing="0.5">GEOMETRIC ACCURACY &amp; CONVEXITY GUARANTEES</text>

  <!-- Point Ordering Diagram -->
  <g transform="translate(80, 410)">
    <polygon points="20,10 160,20 145,110 30,100" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="20" cy="10" r="5" fill="#38bdf8" />
    <text x="10" y="0" font-size="11" font-weight="700" fill="#38bdf8">Top-Left</text>

    <circle cx="160" cy="20" r="5" fill="#818cf8" />
    <text x="165" y="15" font-size="11" font-weight="700" fill="#818cf8">Top-Right</text>

    <circle cx="145" cy="110" r="5" fill="#34d399" />
    <text x="150" y="125" font-size="11" font-weight="700" fill="#34d399">Bottom-Right</text>

    <circle cx="30" cy="100" r="5" fill="#f43f5e" />
    <text x="5" y="125" font-size="11" font-weight="700" fill="#f43f5e">Bottom-Left</text>

    <text x="90" y="65" font-size="11" fill="#64748b" text-anchor="middle">Convex Quad</text>
  </g>

  <!-- Arrow transform -->
  <path d="M 280 470 L 330 470" stroke="#38bdf8" stroke-width="2" fill="none" />
  <polygon points="330,466 338,470 330,474" fill="#38bdf8" />

  <!-- Rectified diagram -->
  <g transform="translate(360, 410)">
    <rect x="0" y="10" width="130" height="100" rx="4" fill="#1e293b" stroke="#34d399" stroke-width="1.5" />
    <text x="65" y="65" font-size="11" fill="#34d399" text-anchor="middle" font-weight="600">Rectified Document</text>
    <text x="65" y="80" font-size="10" fill="#64748b" text-anchor="middle">CIPerspectiveCorrection</text>
  </g>

  <!-- Specifications Table -->
  <g transform="translate(540, 400)">
    <text x="0" y="20" font-size="13" font-weight="600" fill="#f8fafc">Performance &amp; Concurrency Characteristics</text>
    <text x="0" y="45" font-size="12" fill="#cbd5e1">⚡ <tspan font-weight="600">Strict Swift 6 Concurrency:</tspan> All models and processors are Sendable</text>
    <text x="0" y="70" font-size="12" fill="#cbd5e1">📐 <tspan font-weight="600">Shoelace Formula Area:</tspan> Direct polygonal surface calculation</text>
    <text x="0" y="95" font-size="12" fill="#cbd5e1">🛡️ <tspan font-weight="600">Automatic Point Reordering:</tspan> Scrambled corners sorted automatically</text>
    <text x="0" y="120" font-size="12" fill="#cbd5e1">🖥️ <tspan font-weight="600">Cross-Platform:</tspan> iOS 15+, macOS 12+, Mac Catalyst</text>
    <text x="0" y="145" font-size="12" fill="#cbd5e1">📦 <tspan font-weight="600">Zero External Dependencies:</tspan> Built entirely on Apple Vision &amp; CoreImage</text>
  </g>
</svg>
